<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Codex Pulse 脉点品牌标识提案"><defs><linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#32322D"/><stop offset="1" stop-color="#171715"/></linearGradient></defs><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#F3F3F0"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif"><text x="56" y="65" font-size="40" font-weight="600" fill="#1F1E1D">脉点</text><text x="180" y="62" font-size="13" font-weight="500" fill="#6D6B67" letter-spacing="1.5">CODEX PULSE / BRAND EXPLORATION</text><text x="1305" y="62" font-size="12" font-weight="500" fill="#6D6B67" letter-spacing="1">01  ·  VECTOR CONCEPT</text><rect x="56" y="108" width="820" height="650" rx="28" fill="#1B1B19"/><text x="92" y="150" font-size="12" font-weight="500" fill="#B4B2AC" letter-spacing="2">PULSE MARK</text><text x="696" y="150" font-size="12" font-weight="400" fill="#B4B2AC">推荐方案</text><g transform="translate(306 217) scale(1.25)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="290" y="608" font-size="48" font-weight="600" fill="#F5F5F5">Codex Pulse</text><text x="315" y="649" font-size="19" font-weight="400" fill="#B4B2AC" letter-spacing="3">额度 · 任务 · 会话</text><text x="92" y="722" font-size="16" font-weight="400" fill="#B4B2AC">开放的 P 形轮廓 + 一枚脉点</text><rect x="900" y="108" width="644" height="334" rx="24" fill="#FCFCFB" stroke="#E1E0D9"/><g transform="translate(938 161) scale(0.6015625)"><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#C6613F" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#C6613F"/></g><text x="1130" y="218" font-size="44" font-weight="600" fill="#1F1E1D">Pulse</text><text x="1133" y="253" font-size="17" font-weight="400" fill="#6D6B67">运行有迹，变化可见。</text><text x="938" y="351" font-size="23" font-weight="500" fill="#1F1E1D">原创几何图形，适合小尺寸界面</text><text x="938" y="392" font-size="15" font-weight="400" fill="#6D6B67">陶土主色  /  圆端粗线  /  开放负空间</text><rect x="900" y="466" width="644" height="292" rx="24" fill="#EAE9E4"/><g transform="translate(950 519) scale(0.421875)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="968" y="669" font-size="15" font-weight="500" fill="#52514E">深色图标</text><g transform="translate(1154 519) scale(0.421875)"><rect x="8" y="8" width="240" height="240" rx="54" fill="#F7F7F5" stroke="#DCDAD1"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#C6613F" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#C6613F"/></g><text x="1172" y="669" font-size="15" font-weight="500" fill="#52514E">浅色图标</text><g transform="translate(1358 519) scale(0.421875)"><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#1F1E1D" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#1F1E1D"/></g><text x="1376" y="669" font-size="15" font-weight="500" fill="#52514E">单色标记</text><text x="938" y="724" font-size="15" font-weight="400" fill="#6D6B67">无需依赖彩色渐变，也能识别轮廓。</text><rect x="56" y="782" width="1488" height="236" rx="24" fill="#FCFCFB" stroke="#E1E0D9"/><text x="90" y="824" font-size="17" font-weight="600" fill="#1F1E1D">实际界面与小尺寸应用</text><rect x="90" y="848" width="420" height="111" rx="18" fill="#1B1B19"/><g transform="translate(108 868) scale(0.1875)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="174" y="889" font-size="21" font-weight="600" fill="#F5F5F5">Codex Pulse</text><text x="174" y="918" font-size="13" font-weight="400" fill="#B4B2AC">账号 6 · Pro 20x</text><text x="112" y="990" font-size="13" font-weight="400" fill="#6D6B67">面板页头示意</text><rect x="550" y="848" width="370" height="52" rx="14" fill="#21211E"/><g transform="translate(572 864) scale(0.078125)"><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#F5F5F5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#F5F5F5"/></g><text x="608" y="881" font-size="16" font-weight="500" fill="#F5F5F5">21%</text><text x="672" y="881" font-size="13" font-weight="400" fill="#B4B2AC">菜单栏单色示意</text><text x="550" y="935" font-size="14" font-weight="400" fill="#6D6B67">固定标识，不承担实时状态灯职责。</text><text x="550" y="965" font-size="13" font-weight="400" fill="#6D6B67">语义绿／橙／红继续留给额度与任务状态。</text><g transform="translate(1000 865) scale(0.0625)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="998" y="949" font-size="13" font-weight="400" fill="#6D6B67">16 px</text><g transform="translate(1097 865) scale(0.09375)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="1095" y="949" font-size="13" font-weight="400" fill="#6D6B67">24 px</text><g transform="translate(1208 865) scale(0.125)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="1206" y="949" font-size="13" font-weight="400" fill="#6D6B67">32 px</text><g transform="translate(1343 865) scale(0.1875)"><rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#3A3A35"/><path d="M72 194V87C72 69 86 56 105 56H134C166 56 188 79 188 109C188 139 166 162 136 162H112" fill="none" stroke="#D97757" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="194" r="14" fill="#D97757"/></g><text x="1341" y="949" font-size="13" font-weight="400" fill="#6D6B67">48 px</text><text x="990" y="990" font-size="13" font-weight="400" fill="#6D6B67">同一份矢量，缩小时保留主轮廓。</text><text x="56" y="1054" font-size="13" font-weight="400" fill="#6D6B67">原创矢量提案 · 名称暂定 · 尚未替换应用与 CoverAI 品牌资产</text><rect x="1376" y="1036" width="24" height="24" rx="7" fill="#D97757"/><rect x="1416" y="1036" width="24" height="24" rx="7" fill="#C6613F"/><rect x="1456" y="1036" width="24" height="24" rx="7" fill="#1B1B19"/><rect x="1496" y="1036" width="24" height="24" rx="7" fill="#EAE9E4"/></g></svg>